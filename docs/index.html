<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞鸿看AI — 全球AI大模型日报</title>
<meta name="description" content="飞鸿看AI，每日全球AI大模型和应用动态，智能采集、AI摘要、一站式浏览">
<style>
/* ============================================================
   Theme Variables
   ============================================================ */
:root, [data-theme="light"] {
  --bg: #f0f4f8;
  --card: #ffffff;
  --card-hover: #fafbfc;
  --text: #1a202c;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --accent-light: #eff6ff;
  --accent2: #8b5cf6;
  --border: #e2e8f0;
  --star: #f59e0b;
  --star-empty: #cbd5e1;
  --trending: #ef4444;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --shadow-hover: 0 4px 14px rgba(0,0,0,.1);
  --gradient-hero: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
  --tag-bg: #f1f5f9;
  --tag-text: #475569;
  --section-hover: #f8fafc;
  --badge-model: #dbeafe;
  --badge-model-text: #1d4ed8;
  --badge-app: #dcfce7;
  --badge-app-text: #15803d;
  --badge-research: #fef3c7;
  --badge-research-text: #92400e;
  --badge-funding: #fce7f3;
  --badge-funding-text: #9d174d;
  --badge-policy: #e0e7ff;
  --badge-policy-text: #3730a3;
  --badge-opportunity: #ede9fe;
  --badge-opportunity-text: #5b21b6;
}
[data-theme="dark"] {
  --bg: #0b1120;
  --card: #1a2332;
  --card-hover: #1f2a3d;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #60a5fa;
  --accent-light: #1e3a5f;
  --accent2: #a78bfa;
  --border: #1e3a5f;
  --star: #fbbf24;
  --star-empty: #475569;
  --trending: #f87171;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --shadow-hover: 0 4px 16px rgba(0,0,0,.5);
  --gradient-hero: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 50%, #be185d 100%);
  --tag-bg: #1e3a5f;
  --tag-text: #93c5fd;
  --section-hover: #1a2a3d;
  --badge-model: #1e3a5f;
  --badge-model-text: #93c5fd;
  --badge-app: #14532d;
  --badge-app-text: #86efac;
  --badge-research: #422006;
  --badge-research-text: #fcd34d;
  --badge-funding: #500724;
  --badge-funding-text: #f9a8d4;
  --badge-policy: #1e1b4b;
  --badge-policy-text: #c7d2fe;
  --badge-opportunity: #2e1065;
  --badge-opportunity-text: #c4b5fd;
}

/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background .3s, color .3s;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }

/* ============================================================
   Hero
   ============================================================ */
.hero {
  background: var(--gradient-hero);
  color: #fff;
  padding: 36px 16px 28px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 80%, rgba(255,255,255,.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255,255,255,.06) 0%, transparent 50%);
  pointer-events: none;
}
.hero-logo {
  font-size: 2rem;
  font-weight: 900;
  letter-spacing: -.02em;
  position: relative;
  z-index: 1;
}
.hero-logo span { color: #fbbf24; }
.hero .subtitle {
  font-size: .85rem;
  opacity: .8;
  margin-top: 6px;
  position: relative;
  z-index: 1;
  font-weight: 400;
}

/* ============================================================
   Container
   ============================================================ */
.container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

/* ============================================================
   Toolbar
   ============================================================ */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 0 8px;
  flex-wrap: wrap;
}
.date-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}
.date-nav button {
  width: 34px; height: 34px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--card);
  color: var(--text);
  font-size: .9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}
.date-nav button:hover { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
.date-nav input[type="date"] {
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  font-size: .82rem;
  font-family: inherit;
  cursor: pointer;
}
.date-nav input[type="date"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.today-label {
  font-weight: 600;
  font-size: .85rem;
  min-width: 100px;
  text-align: center;
}

.toolbar-actions { display: flex; gap: 6px; }
.theme-toggle, .expand-all-btn {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  color: var(--text-secondary);
  font-size: .78rem;
  cursor: pointer;
  transition: all .15s;
  font-family: inherit;
  white-space: nowrap;
}
.theme-toggle:hover, .expand-all-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ============================================================
   Summary Card
   ============================================================ */
.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent2);
  border-radius: 10px;
  padding: 18px 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.summary-card .summary-header {
  font-size: .9rem;
  font-weight: 700;
  color: var(--accent2);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.summary-card p {
  font-size: .86rem;
  line-height: 1.8;
  color: var(--text-secondary);
}

/* ============================================================
   Category Section (collapsible)
   ============================================================ */
.cat-section {
  margin-bottom: 12px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--card);
  box-shadow: var(--shadow);
}
.cat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  transition: background .15s;
}
.cat-header:hover { background: var(--section-hover); }
.cat-header .cat-icon { font-size: 1.3rem; flex-shrink: 0; }
.cat-header .cat-name { font-weight: 700; font-size: .95rem; flex: 1; }
.cat-header .cat-count {
  background: var(--accent-light);
  color: var(--accent);
  font-size: .75rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 12px;
  white-space: nowrap;
}
.cat-header .cat-arrow {
  font-size: .7rem;
  color: var(--text-muted);
  transition: transform .3s;
  flex-shrink: 0;
}
.cat-section.collapsed .cat-arrow { transform: rotate(-90deg); }

.cat-body {
  transition: max-height .4s ease, opacity .3s ease;
  max-height: 8000px;
  opacity: 1;
  overflow: hidden;
}
.cat-section.collapsed .cat-body { max-height: 0; opacity: 0; }
.cat-body-inner { padding: 0 12px 16px; }

/* Waterfall / Masonry */
.cat-masonry {
  column-count: 1;
  column-gap: 12px;
}
@media (min-width: 600px) {
  .cat-masonry { column-count: 2; }
}
@media (min-width: 900px) {
  .cat-masonry { column-count: 3; }
}

/* ============================================================
   Item Card
   ============================================================ */
.item-card {
  background: var(--card-hover);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  break-inside: avoid;
  margin-bottom: 12px;
  transition: transform .15s, box-shadow .15s;
  position: relative;
}
.item-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}
.item-card .item-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 6px;
}
.item-card .item-title {
  font-size: .9rem;
  font-weight: 600;
  line-height: 1.45;
  flex: 1;
}
.item-card .item-title a:hover { color: var(--accent); }
.item-stars {
  display: flex;
  gap: 1px;
  font-size: .72rem;
  flex-shrink: 0;
  color: var(--star);
  margin-top: 2px;
}
.item-stars .empty { color: var(--star-empty); }

.item-summary {
  font-size: .8rem;
  line-height: 1.65;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.item-trending {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 10px;
  background: rgba(239,68,68,.12);
  color: var(--trending);
  font-size: .68rem;
  font-weight: 700;
  margin-left: 4px;
}

.item-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}
.item-tag {
  font-size: .68rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--tag-bg);
  color: var(--tag-text);
  transition: background .15s;
}

.item-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  font-size: .7rem;
  color: var(--text-muted);
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.item-source {
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--tag-bg);
  color: var(--tag-text);
  font-weight: 500;
}
.item-external-link {
  margin-left: auto;
  color: var(--accent);
  font-size: .75rem;
  opacity: 0;
  transition: opacity .15s;
}
.item-card:hover .item-external-link { opacity: 1; }

/* ============================================================
   State Messages
   ============================================================ */
.state-message {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.state-message .icon { font-size: 3rem; margin-bottom: 12px; }
.state-message h3 { font-size: 1.1rem; margin-bottom: 6px; color: var(--text); }
.state-message p { font-size: .85rem; }
.state-message button {
  margin-top: 16px;
  padding: 8px 20px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-size: .85rem;
  cursor: pointer;
  font-family: inherit;
  transition: opacity .15s;
}
.state-message button:hover { opacity: .85; }

/* Loading */
.loading-dots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.loading-dots span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: bounce 1.4s infinite ease-in-out both;
}
.loading-dots span:nth-child(1) { animation-delay: -.32s; }
.loading-dots span:nth-child(2) { animation-delay: -.16s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* ============================================================
   Footer
   ============================================================ */
.footer {
  text-align: center;
  padding: 24px 16px;
  font-size: .75rem;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  margin-top: 20px;
}
.footer .stats-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.footer .stat { display: flex; align-items: center; gap: 4px; }
.footer .stat strong { color: var(--text); }
</style>
</head>
<body data-theme="light">

<!-- Hero -->
<header class="hero">
  <h1 class="hero-logo"><span>飞鸿</span>看AI</h1>
  <p class="subtitle">全球AI大模型日报 · 每日自动采集 · DeepSeek智能摘要</p>
</header>

<div class="container">

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="date-nav">
      <button onclick="changeDate(-1)" title="前一天">◀</button>
      <input type="date" id="datePicker" onchange="jumpToDate(this.value)" />
      <button onclick="changeDate(1)" title="后一天">▶</button>
      <span class="today-label" id="dateLabel">—</span>
    </div>
    <div class="toolbar-actions">
      <button class="expand-all-btn" onclick="toggleAllSections()" id="expandBtn">📂 全部展开</button>
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> 暗色
      </button>
    </div>
  </div>

  <!-- Summary -->
  <div class="summary-card" id="summaryCard" style="display:none">
    <div class="summary-header">📋 今日综述</div>
    <p id="summaryText"></p>
  </div>

  <!-- Category Sections -->
  <div id="sectionsContainer"></div>

  <!-- States -->
  <div class="state-message" id="loadingState">
    <h3>📡 正在加载简报...</h3>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>
  <div class="state-message" id="emptyState" style="display:none">
    <div class="icon">📭</div>
    <h3 id="emptyTitle">暂无简报</h3>
    <p id="emptyMsg">该日期尚未生成简报数据</p>
  </div>
  <div class="state-message" id="errorState" style="display:none">
    <div class="icon">⚠️</div>
    <h3>加载失败</h3>
    <p id="errorMsg"></p>
    <button onclick="loadBriefing(currentDate)">🔄 重试</button>
  </div>

</div>

<footer class="footer">
  <div class="stats-row">
    <span class="stat">📰 来源: <strong id="statSources">-</strong></span>
    <span class="stat">📝 条目: <strong id="statItems">-</strong></span>
    <span class="stat">🤖 模型: <strong id="statModel">-</strong></span>
    <span class="stat">💵 费用: <strong id="statCost">-</strong></span>
  </div>
  <div>Generated at <span id="footerTime">—</span> · Powered by DeepSeek</div>
  <div style="margin-top:2px">飞鸿看AI · 每日更新</div>
</footer>

<script>
/* ============================================================
   State
   ============================================================ */
let currentDate = '';
let currentBriefing = null;

/* ============================================================
   Category Config
   ============================================================ */
const CAT_ORDER = ['模型发布', '应用产品', '研究前沿', '商业商机', '投融资', '政策监管'];
const CAT_ICONS = { '模型发布': '🧠', '应用产品': '🚀', '研究前沿': '🔬', '商业商机': '💡', '投融资': '💰', '政策监管': '⚖️' };
const CAT_COLORS = {
  '模型发布': 'badge-model', '应用产品': 'badge-app',
  '研究前沿': 'badge-research', '投融资': 'badge-funding', '政策监管': 'badge-policy'
};

/* ============================================================
   Init
   ============================================================ */
function init() {
  const saved = localStorage.getItem('ai-briefing-theme') || 'light';
  setTheme(saved);
  const today = new Date();
  currentDate = formatDate(today);
  document.getElementById('datePicker').value = currentDate;
  document.getElementById('dateLabel').textContent = formatDateLabel(currentDate);
  loadBriefing(currentDate);
}

/* ============================================================
   Theme
   ============================================================ */
function setTheme(t) {
  document.body.dataset.theme = t;
  document.getElementById('themeIcon').textContent = t === 'dark' ? '☀️' : '🌙';
  document.querySelector('.theme-toggle').innerHTML =
    `<span id="themeIcon">${t === 'dark' ? '☀️' : '🌙'}</span> ${t === 'dark' ? '亮色' : '暗色'}`;
  localStorage.setItem('ai-briefing-theme', t);
}
function toggleTheme() {
  setTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');
}

/* ============================================================
   Date
   ============================================================ */
function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function formatDateLabel(s) {
  const d = parseDate(s);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today)/86400000);
  if (diff === 0) return '今天';
  if (diff === -1) return '昨天';
  if (diff === 1) return '明天';
  return `${s} ${['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}`;
}
function changeDate(delta) {
  const d = parseDate(currentDate);
  d.setDate(d.getDate() + delta);
  currentDate = formatDate(d);
  document.getElementById('datePicker').value = currentDate;
  document.getElementById('dateLabel').textContent = formatDateLabel(currentDate);
  loadBriefing(currentDate);
}
function jumpToDate(v) {
  if (!v) return;
  currentDate = v;
  document.getElementById('dateLabel').textContent = formatDateLabel(currentDate);
  loadBriefing(currentDate);
}

/* ============================================================
   Load
   ============================================================ */
async function loadBriefing(dateStr) {
  showLoading();
  try {
    const resp = await fetch(`briefings/${dateStr}.json`);
    if (!resp.ok) { showEmpty(dateStr, resp.status); return; }
    const data = await resp.json();
    if (!data || data.total_items === 0) { showEmpty(dateStr); return; }
    currentBriefing = data;
    renderAll(data);
    showContent();
  } catch (e) {
    showError(`加载失败: ${e.message}`);
  }
}

/* ============================================================
   Render
   ============================================================ */
function renderAll(data) {
  renderSummary(data);
  renderSections(data);
  renderFooter(data);
}

function renderSummary(data) {
  const card = document.getElementById('summaryCard');
  const text = document.getElementById('summaryText');
  if (data.briefing_summary) {
    card.style.display = 'block';
    text.textContent = data.briefing_summary;
  } else {
    card.style.display = 'none';
  }
}

function renderSections(data) {
  const container = document.getElementById('sectionsContainer');
  const items = data.items || [];
  const cats = data.categories || {};

  // Group items by category
  const grouped = {};
  for (const cat of CAT_ORDER) { grouped[cat] = []; }
  for (const item of items) {
    const c = item.category || '应用产品';
    if (grouped[c]) grouped[c].push(item);
    else grouped['应用产品'].push(item);
  }

  let html = '';
  for (const cat of CAT_ORDER) {
    const catItems = grouped[cat] || [];
    if (catItems.length === 0) continue;

    const icon = CAT_ICONS[cat] || '📌';
    html += `
    <div class="cat-section" id="section-${cat}">
      <div class="cat-header" onclick="toggleSection('${cat}')">
        <span class="cat-icon">${icon}</span>
        <span class="cat-name">${cat}</span>
        <span class="cat-count">${catItems.length} 条</span>
        <span class="cat-arrow">▼</span>
      </div>
      <div class="cat-body">
        <div class="cat-body-inner">
          <div class="cat-masonry">
            ${catItems.map(item => renderItemCard(item)).join('')}
          </div>
        </div>
      </div>
    </div>`;
  }
  container.innerHTML = html;
}

function renderItemCard(item) {
  const starsHtml = Array.from({length:5}, (_,i) =>
    i < (item.importance||3) ? '<span>★</span>' : '<span class="empty">★</span>'
  ).join('');

  const tags = (item.tags||[]).slice(0,5)
    .map(t => `<span class="item-tag">#${escapeHtml(t)}</span>`).join('');

  const trendingHtml = item.is_trending ? '<span class="item-trending">🔥 热门</span>' : '';

  return `
  <article class="item-card">
    <div class="item-header">
      <div class="item-title">
        <a href="${escapeHtml(item.source_url||'#')}" target="_blank" rel="noopener">${escapeHtml(item.title_zh || item.title_en || '(无标题)')}</a>
      </div>
      <div class="item-stars">${starsHtml}</div>
    </div>
    <div class="item-summary">${escapeHtml(item.summary_zh||'')}${trendingHtml}</div>
    ${tags ? `<div class="item-tags">${tags}</div>` : ''}
    <div class="item-meta">
      <span class="item-source">${escapeHtml(item.source_name||'')}</span>
      ${item.subcategory ? `<span>${escapeHtml(item.subcategory)}</span>` : ''}
      <a class="item-external-link" href="${escapeHtml(item.source_url||'#')}" target="_blank" rel="noopener">↗</a>
    </div>
  </article>`;
}

function renderFooter(data) {
  const st = data.stats || {};
  document.getElementById('statSources').textContent = st.sources_count || '-';
  document.getElementById('statItems').textContent = data.total_items || '-';
  document.getElementById('statModel').textContent = data.model || '-';
  document.getElementById('statCost').textContent = st.api_cost_estimate_usd != null ? `$${st.api_cost_estimate_usd.toFixed(4)}` : '-';
  document.getElementById('footerTime').textContent = data.generated_at || '—';
}

/* ============================================================
   Section Collapse
   ============================================================ */
function toggleSection(cat) {
  const section = document.getElementById('section-' + cat);
  if (!section) return;
  section.classList.toggle('collapsed');
  updateExpandBtn();
}

function toggleAllSections() {
  const sections = document.querySelectorAll('.cat-section');
  const anyOpen = Array.from(sections).some(s => !s.classList.contains('collapsed'));
  sections.forEach(s => s.classList.toggle('collapsed', anyOpen));
  updateExpandBtn();
}

function updateExpandBtn() {
  const sections = document.querySelectorAll('.cat-section');
  const anyOpen = Array.from(sections).some(s => !s.classList.contains('collapsed'));
  document.getElementById('expandBtn').innerHTML = anyOpen ? '📂 全部收起' : '📂 全部展开';
}

/* ============================================================
   UI States
   ============================================================ */
function showLoading() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('sectionsContainer').innerHTML = '';
}
function showContent() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';
}
function showEmpty(dateStr, status) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('sectionsContainer').innerHTML = '';
  document.getElementById('emptyTitle').textContent = status === 404 ? '暂无简报' : '加载失败';
  document.getElementById('emptyMsg').textContent = status === 404 ? `${dateStr} 尚未生成简报` : `HTTP ${status}`;
  document.getElementById('statSources').textContent = '-';
  document.getElementById('statItems').textContent = '-';
  document.getElementById('statModel').textContent = '-';
  document.getElementById('statCost').textContent = '-';
  document.getElementById('footerTime').textContent = '—';
}
function showError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('errorState').style.display = 'block';
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('sectionsContainer').innerHTML = '';
  document.getElementById('errorMsg').textContent = msg;
}
function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

init();
</script>
