<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Daily Briefing — 全球AI大模型日报</title>
<meta name="description" content="每日全球AI大模型和应用动态，智能采集、自动摘要、一站式浏览">
<style>
/* ============================================================
   CSS Custom Properties — 主题变量
   ============================================================ */
:root, [data-theme="light"] {
  --bg: #f0f4f8;
  --bg-secondary: #e2e8f0;
  --card: #ffffff;
  --card-hover: #f8fafc;
  --text: #1a202c;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --accent-light: #eff6ff;
  --border: #e2e8f0;
  --star: #f59e0b;
  --star-empty: #cbd5e1;
  --trending: #ef4444;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.1);
  --gradient-hero: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --tag-bg: #f1f5f9;
  --tag-text: #475569;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --bg-secondary: #1e293b;
  --card: #1e293b;
  --card-hover: #273548;
  --text: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #60a5fa;
  --accent-light: #1e3a5f;
  --border: #334155;
  --star: #fbbf24;
  --star-empty: #475569;
  --trending: #f87171;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-hover: 0 4px 12px rgba(0,0,0,.5);
  --gradient-hero: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  --tag-bg: #1e3a5f;
  --tag-text: #93c5fd;
}

/* ============================================================
   Reset & Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  transition: background .3s, color .3s;
  min-height: 100vh;
}

/* ============================================================
   Layout
   ============================================================ */
.container { max-width: 960px; margin: 0 auto; padding: 0 16px; }

/* ============================================================
   Header / Hero
   ============================================================ */
.hero {
  background: var(--gradient-hero);
  color: #fff;
  padding: 32px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
}
.hero h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -.02em;
  position: relative;
  z-index: 1;
}
.hero .subtitle {
  font-size: .85rem;
  opacity: .85;
  margin-top: 6px;
  position: relative;
  z-index: 1;
}

/* ============================================================
   Toolbar — 日期导航 + 主题切换
   ============================================================ */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 0;
  flex-wrap: wrap;
}
.date-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}
.date-nav button {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  font-size: 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, border-color .15s;
}
.date-nav button:hover { border-color: var(--accent); background: var(--accent-light); }
.date-nav input[type="date"] {
  height: 36px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  font-size: .85rem;
  font-family: inherit;
  cursor: pointer;
}
.date-nav input[type="date"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.today-label {
  font-weight: 600;
  font-size: .9rem;
  color: var(--text);
  min-width: 100px;
  text-align: center;
}

.toolbar-actions { display: flex; gap: 8px; }
.theme-toggle {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--text);
  font-size: .85rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: background .15s;
}
.theme-toggle:hover { background: var(--accent-light); }
.theme-toggle .icon { font-size: 1.1rem; }

/* ============================================================
   Summary Card
   ============================================================ */
.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  position: relative;
}
.summary-card h2 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
}
.summary-card p {
  font-size: .9rem;
  line-height: 1.75;
  color: var(--text);
}

/* ============================================================
   Category Tabs
   ============================================================ */
.category-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.cat-tab {
  padding: 7px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-secondary);
  font-size: .82rem;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  font-family: inherit;
}
.cat-tab:hover { border-color: var(--accent); color: var(--accent); }
.cat-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.cat-tab .count {
  display: inline-block;
  background: rgba(255,255,255,.25);
  color: inherit;
  border-radius: 10px;
  padding: 0 7px;
  font-size: .75rem;
  margin-left: 4px;
  min-width: 20px;
  text-align: center;
}
.cat-tab:not(.active) .count {
  background: var(--bg-secondary);
  color: var(--text-muted);
}

/* ============================================================
   Items Grid
   ============================================================ */
.items-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
  margin-bottom: 32px;
}
@media (min-width: 768px) {
  .items-grid { grid-template-columns: 1fr 1fr; }
}

.item-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s, background .15s;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.item-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
  background: var(--card-hover);
}
.item-card.hidden { display: none; }

.item-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}
.item-title {
  font-size: .92rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--text);
  flex: 1;
}
.item-title a {
  color: inherit;
  text-decoration: none;
}
.item-title a:hover { color: var(--accent); }

.item-stars {
  display: flex;
  gap: 1px;
  font-size: .8rem;
  flex-shrink: 0;
  color: var(--star);
}
.item-stars .empty { color: var(--star-empty); }

.item-summary {
  font-size: .82rem;
  line-height: 1.6;
  color: var(--text-secondary);
}

.item-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  font-size: .75rem;
  color: var(--text-muted);
  margin-top: auto;
}
.item-source {
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--tag-bg);
  color: var(--tag-text);
  font-weight: 500;
}
.item-category-tag {
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 500;
}
.item-trending {
  color: var(--trending);
  font-weight: 600;
  font-size: .72rem;
}

.item-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.item-tag {
  font-size: .7rem;
  padding: 1px 7px;
  border-radius: 10px;
  background: var(--bg-secondary);
  color: var(--text-muted);
}

/* ============================================================
   States: Loading, Empty, Error
   ============================================================ */
.state-message {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.state-message .icon { font-size: 3rem; margin-bottom: 12px; }
.state-message h3 { font-size: 1.1rem; margin-bottom: 6px; color: var(--text); }
.state-message p { font-size: .85rem; }
.state-message button {
  margin-top: 16px;
  padding: 8px 20px;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-size: .85rem;
  cursor: pointer;
  font-family: inherit;
}
.state-message button:hover { opacity: .9; }

.loading-dots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.loading-dots span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  animation: bounce 1.4s infinite ease-in-out both;
}
.loading-dots span:nth-child(1) { animation-delay: -.32s; }
.loading-dots span:nth-child(2) { animation-delay: -.16s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0); }
  40% { transform: scale(1); }
}

/* ============================================================
   Footer
   ============================================================ */
.footer {
  text-align: center;
  padding: 24px 16px;
  font-size: .78rem;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  margin-top: 16px;
}
.footer .stats-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.footer .stat { display: flex; align-items: center; gap: 4px; }
.footer .stat strong { color: var(--text); }
</style>
</head>
<body data-theme="light">

<!-- Hero -->
<header class="hero">
  <h1>🤖 AI Daily Briefing</h1>
  <p class="subtitle">全球AI大模型日报 · 每日自动采集 · AI智能摘要</p>
</header>

<div class="container">

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="date-nav">
      <button onclick="changeDate(-1)" title="前一天">◀</button>
      <input type="date" id="datePicker" onchange="jumpToDate(this.value)" />
      <button onclick="changeDate(1)" title="后一天">▶</button>
      <span class="today-label" id="dateLabel">—</span>
    </div>
    <div class="toolbar-actions">
      <button class="theme-toggle" onclick="toggleTheme()" title="切换暗色/亮色模式">
        <span class="icon" id="themeIcon">🌙</span> 暗色模式
      </button>
    </div>
  </div>

  <!-- Summary -->
  <div class="summary-card" id="summaryCard" style="display:none">
    <h2>📋 今日综述</h2>
    <p id="summaryText"></p>
  </div>

  <!-- Category Tabs -->
  <div class="category-tabs" id="categoryTabs"></div>

  <!-- Items -->
  <div class="items-grid" id="itemsGrid"></div>

  <!-- Loading State -->
  <div class="state-message" id="loadingState">
    <h3>📡 正在加载简报...</h3>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- Empty / Error State -->
  <div class="state-message" id="emptyState" style="display:none">
    <div class="icon">📭</div>
    <h3 id="emptyTitle">暂无简报</h3>
    <p id="emptyMsg">该日期尚未生成简报数据</p>
  </div>

  <!-- Error State -->
  <div class="state-message" id="errorState" style="display:none">
    <div class="icon">⚠️</div>
    <h3>加载失败</h3>
    <p id="errorMsg"></p>
    <button onclick="loadBriefing(currentDate)">🔄 重试</button>
  </div>

</div>

<footer class="footer">
  <div class="stats-row">
    <span class="stat">📰 来源: <strong id="statSources">-</strong></span>
    <span class="stat">📝 条目: <strong id="statItems">-</strong></span>
    <span class="stat">🤖 模型: <strong id="statModel">-</strong></span>
    <span class="stat">💵 费用: <strong id="statCost">-</strong></span>
  </div>
  <div>Generated at <span id="footerTime">—</span> · Powered by DeepSeek API</div>
</footer>

<script>
/* ============================================================
   Global State
   ============================================================ */
let currentDate = '';
let currentBriefing = null;
let activeCategory = 'all';

/* ============================================================
   Init
   ============================================================ */
function init() {
  // 加载保存的主题
  const savedTheme = localStorage.getItem('ai-briefing-theme') || 'light';
  setTheme(savedTheme);

  // 获取今天的日期
  const today = new Date();
  currentDate = formatDate(today);
  document.getElementById('datePicker').value = currentDate;
  document.getElementById('dateLabel').textContent = formatDateLabel(currentDate);

  // 加载简报
  loadBriefing(currentDate);
}

/* ============================================================
   Theme
   ============================================================ */
function setTheme(theme) {
  document.body.dataset.theme = theme;
  document.getElementById('themeIcon').textContent = theme === 'dark' ? '☀️' : '🌙';
  const label = theme === 'dark' ? '亮色模式' : '暗色模式';
  document.querySelector('.theme-toggle').innerHTML = `<span class="icon">${theme === 'dark' ? '☀️' : '🌙'}</span> ${label}`;
  localStorage.setItem('ai-briefing-theme', theme);
}
function toggleTheme() {
  const current = document.body.dataset.theme;
  setTheme(current === 'dark' ? 'light' : 'dark');
}

/* ============================================================
   Date Navigation
   ============================================================ */
function formatDate(d) {
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}
function parseDate(str) { return new Date(str + 'T00:00:00'); }
function formatDateLabel(str) {
  const d = parseDate(str);
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return '今天';
  if (diff === -1) return '昨天';
  if (diff === 1) return '明天';
  const days = ['周日','周一','周二','周三','周四','周五','周六'];
  return `${str} ${days[d.getDay()]}`;
}

function changeDate(delta) {
  const d = parseDate(currentDate);
  d.setDate(d.getDate() + delta);
  currentDate = formatDate(d);
  document.getElementById('datePicker').value = currentDate;
  document.getElementById('dateLabel').textContent = formatDateLabel(currentDate);
  loadBriefing(currentDate);
}
function jumpToDate(dateStr) {
  if (!dateStr) return;
  currentDate = dateStr;
  document.getElementById('dateLabel').textContent = formatDateLabel(currentDate);
  loadBriefing(currentDate);
}

/* ============================================================
   Data Loading
   ============================================================ */
async function loadBriefing(dateStr) {
  showLoading();

  try {
    const resp = await fetch(`briefings/${dateStr}.json`);
    if (!resp.ok) {
      if (resp.status === 404) {
        showEmpty(dateStr);
      } else {
        showError(`HTTP ${resp.status}: ${resp.statusText}`);
      }
      return;
    }
    const data = await resp.json();
    if (!data || data.total_items === 0) {
      showEmpty(dateStr);
      return;
    }
    currentBriefing = data;
    activeCategory = 'all';
    renderAll(data);
    showContent();
  } catch (err) {
    showError(`无法加载简报: ${err.message}`);
  }
}

/* ============================================================
   Rendering
   ============================================================ */
function renderAll(data) {
  renderSummary(data);
  renderCategories(data);
  renderItems(data, 'all');
  renderFooter(data);
}

function renderSummary(data) {
  const card = document.getElementById('summaryCard');
  const text = document.getElementById('summaryText');
  if (data.briefing_summary) {
    card.style.display = 'block';
    text.textContent = data.briefing_summary;
  } else {
    card.style.display = 'none';
  }
}

function renderCategories(data) {
  const container = document.getElementById('categoryTabs');
  const cats = data.categories || {};

  let html = `<button class="cat-tab active" onclick="filterCategory('all')">全部<span class="count">${data.total_items}</span></button>`;

  const order = ['模型发布', '应用产品', '研究前沿', '投融资', '政策监管'];
  for (const cat of order) {
    const info = cats[cat];
    if (info && info.count > 0) {
      html += `<button class="cat-tab" onclick="filterCategory('${cat}')">${cat}<span class="count">${info.count}</span></button>`;
    }
  }
  container.innerHTML = html;
}

function renderItems(data, filterCat) {
  const grid = document.getElementById('itemsGrid');
  const items = data.items || [];

  const filtered = filterCat === 'all' ? items : items.filter(i => i.category === filterCat);

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="state-message" style="grid-column:1/-1"><p>该分类暂无条目</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(item => {
    const starsHtml = renderStars(item.importance || 3);
    const tags = (item.tags || []).slice(0, 6).map(t => `<span class="item-tag">#${escapeHtml(t)}</span>`).join('');
    const trendingHtml = item.is_trending ? ' <span class="item-trending">🔥 热门</span>' : '';

    return `
      <article class="item-card" data-category="${escapeHtml(item.category || '')}">
        <div class="item-header">
          <div class="item-title">
            <a href="${escapeHtml(item.source_url || '#')}" target="_blank" rel="noopener">${escapeHtml(item.title_zh || item.title_en || '(无标题)')}</a>
          </div>
          <div class="item-stars">${starsHtml}</div>
        </div>
        <div class="item-summary">${escapeHtml(item.summary_zh || '')}${trendingHtml}</div>
        <div class="item-tags">${tags}</div>
        <div class="item-meta">
          <span class="item-source">${escapeHtml(item.source_name || '')}</span>
          <span class="item-category-tag">${escapeHtml(item.category || '')}</span>
          ${item.subcategory ? `<span>${escapeHtml(item.subcategory)}</span>` : ''}
        </div>
      </article>
    `;
  }).join('');
}

function renderStars(n) {
  let html = '';
  for (let i = 1; i <= 5; i++) {
    if (i <= n) {
      html += '<span>★</span>';
    } else {
      html += '<span class="empty">★</span>';
    }
  }
  return html;
}

function renderFooter(data) {
  const stats = data.stats || {};
  document.getElementById('statSources').textContent = stats.sources_count || '-';
  document.getElementById('statItems').textContent = data.total_items || '-';
  document.getElementById('statModel').textContent = data.model || '-';
  document.getElementById('statCost').textContent = stats.api_cost_estimate_usd != null ? `$${stats.api_cost_estimate_usd.toFixed(3)}` : '-';
  document.getElementById('footerTime').textContent = data.generated_at || '—';
}

/* ============================================================
   Filtering
   ============================================================ */
function filterCategory(cat) {
  activeCategory = cat;

  // 更新 tab active 状态
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.classList.toggle('active', tab.textContent.startsWith(cat === 'all' ? '全部' : cat));
  });

  // 过滤卡片
  if (currentBriefing) {
    document.querySelectorAll('.item-card').forEach(card => {
      if (cat === 'all' || card.dataset.category === cat) {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    });
  }
}

/* ============================================================
   UI States
   ============================================================ */
function showLoading() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('categoryTabs').innerHTML = '';
  document.getElementById('itemsGrid').innerHTML = '';
}

function showContent() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';
}

function showEmpty(dateStr) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('errorState').style.display = 'none';
  document.getElementById('emptyState').style.display = 'block';
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('categoryTabs').innerHTML = '';
  document.getElementById('itemsGrid').innerHTML = '';
  document.getElementById('emptyTitle').textContent = '暂无简报';
  document.getElementById('emptyMsg').textContent = `${dateStr} 尚未生成简报数据`;
  // footer
  document.getElementById('statSources').textContent = '-';
  document.getElementById('statItems').textContent = '-';
  document.getElementById('statModel').textContent = '-';
  document.getElementById('statCost').textContent = '-';
  document.getElementById('footerTime').textContent = '—';
}

function showError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('errorState').style.display = 'block';
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('categoryTabs').innerHTML = '';
  document.getElementById('itemsGrid').innerHTML = '';
  document.getElementById('errorMsg').textContent = msg;
}

/* ============================================================
   Utility
   ============================================================ */
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ============================================================
   Boot
   ============================================================ */
init();
</script>
