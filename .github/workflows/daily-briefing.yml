name: Daily AI Briefing

on:
  schedule:
    # 北京时间每天凌晨5点 = UTC 21:00 (前一天)
    - cron: '0 21 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily briefing
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          DEEPSEEK_BASE_URL: https://api.deepseek.com
        run: python scripts/daily_run.py

      - name: Commit & Push
        run: |
          git config user.name "AI Briefing Bot"
          git config user.email "bot@ai-briefing.local"
          git add docs/briefings/ storage/
          git diff --staged --quiet || (git commit -m "Auto: daily briefing $(date +%Y-%m-%d)" && git push)
