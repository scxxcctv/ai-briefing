name: Daily AI Briefing

on:
  schedule:
    # 北京时间每天凌晨5点 = UTC 21:00 (前一天)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily briefing
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          DEEPSEEK_BASE_URL: https://api.deepseek.com
        run: python scripts/daily_run.py

      - name: Upload briefing via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          FILE="docs/briefings/${DATE}.json"

          if [ ! -f "$FILE" ]; then
            echo "No briefing file generated: $FILE"
            exit 0
          fi

          CONTENT=$(cat "$FILE" | python3 -c "import sys,json; print(json.dumps(json.load(sys.stdin), ensure_ascii=False))")

          # Get current file SHA (if file exists on remote)
          SHA=$(gh api "repos/${{ github.repository }}/contents/$FILE" --jq '.sha' 2>/dev/null || echo "")

          if [ -n "$SHA" ]; then
            # Update existing file
            gh api --method PUT "repos/${{ github.repository }}/contents/$FILE" \
              -f message="Auto: daily briefing ${DATE}" \
              -f content="$(echo -n "$CONTENT" | base64 -w0)" \
              -f sha="$SHA"
          else
            # Create new file
            gh api --method PUT "repos/${{ github.repository }}/contents/$FILE" \
              -f message="Auto: daily briefing ${DATE}" \
              -f content="$(echo -n "$CONTENT" | base64 -w0)"
          fi

          echo "Briefing uploaded: $FILE"
